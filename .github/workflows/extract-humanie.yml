name: Extract HUMANIE Submission Bundle
on:
  push:
    paths:
      - ".github/workflows/extract-humanie.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source bundle into repository
        run: |
          set -e
          mkdir -p _bundle_extract
          unzip -o HUMANIE_v0_9_Datanova_Submission_Bundle_FINAL.zip -d _bundle_extract
          ROOT="_bundle_extract/HUMANIE_v0.9_bundle"
          cp -a "$ROOT/HUMANIE_v0.9/." .
          cp "$ROOT"/HUMANIE_Datanova_Judging_Deck_v0.9.* .
          rm -rf _bundle_extract
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract HUMANIE v0.9 submission bundle" || echo "No changes to commit"
          git push
