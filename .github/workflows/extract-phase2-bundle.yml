name: Extract HUMANIE Phase 2 Bundle
on:
  push:
    branches: [main]
    paths:
      - 'HUMANIE_v0_9_Phase2_Full_Cook.zip'
permissions:
  contents: write
jobs:
  extract-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and merge archive into repository
        run: |
          set -e
          ARCHIVE="HUMANIE_v0_9_Phase2_Full_Cook.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/humanie_bundle
          unzip -q "$ARCHIVE" -d /tmp/humanie_bundle
          SRC="/tmp/humanie_bundle/humanie_edit"
          test -d "$SRC"
          cp -a "$SRC/." .
          rm "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract and merge HUMANIE v0.9 Phase 2 bundle"
            git push
          fi
