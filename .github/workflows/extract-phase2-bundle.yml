name: Extract HUMANIE Phase 2 Bundle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and merge archive into repository
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE="HUMANIE_v0_9_Phase2_Full_Cook.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Bundle archive '$ARCHIVE' not found in repository root."
            echo "Root files:"
            ls -la
            exit 1
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$ARCHIVE" -d "$TMP"

          # Locate the bundle payload without assuming a particular ZIP folder layout.
          SRC="$TMP"
          if [[ -d "$TMP/humanie_edit" ]]; then
            SRC="$TMP/humanie_edit"
          elif [[ -d "$TMP/humanie_bundle/humanie_edit" ]]; then
            SRC="$TMP/humanie_bundle/humanie_edit"
          elif [[ -d "$TMP/humanie_bundle/humanie" ]]; then
            SRC="$TMP/humanie_bundle/humanie"
          elif [[ -d "$TMP/humanie" ]]; then
            SRC="$TMP/humanie"
          fi

          # If the ZIP has one enclosing folder, unwrap it.
          if [[ "$SRC" == "$TMP" ]]; then
            mapfile -t dirs < <(find "$TMP" -mindepth 1 -maxdepth 1 -type d)
            if [[ ${#dirs[@]} -eq 1 ]]; then SRC="${dirs[0]}"; fi
          fi

          if [[ ! -d "$SRC" ]]; then
            echo "::error::Could not locate extracted bundle payload."
            find "$TMP" -maxdepth 4 -print
            exit 1
          fi

          echo "Merging payload from: $SRC"
          cp -a "$SRC/." .
          rm -f "$ARCHIVE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract and merge HUMANIE v0.9 Phase 2 bundle"
            git push
          else
            echo "No repository changes detected after merge."
          fi
