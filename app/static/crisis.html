<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUMANIE Crisis Desk</title><body style="font-family:system-ui;max-width:600px;margin:auto;padding:1rem"><h1>HUMANIE Crisis Desk</h1><p>Mobile pilot form. Submit proposals for an authenticated operator to review.</p><label>Case ref <input id="case" value="C-101"></label><label>Event <input id="event" value="Stock shortage"></label><label>Details <textarea id="detail"></textarea></label><button onclick="submitCrisis(false)">Submit proposal</button><button onclick="submitCrisis(true)">Submit with approval checkbox</button><pre id="out"></pre><script>async function submitCrisis(approved){let t=localStorage.getItem('humanie_token');let r=await fetch('/api/crisis',{method:'POST',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:JSON.stringify({case_ref:document.getElementById('case').value,event:document.getElementById('event').value,detail:document.getElementById('detail').value,approved})});document.getElementById('out').textContent=await r.text()}</script></body></html>
